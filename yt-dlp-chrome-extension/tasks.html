<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>yt-dlp 任务中心</title>
  <style>
    :root {
      --bg: #16161f; --card: #1f1f2c; --border: #2e2e40; --text: #e8e8f0;
      --muted: #9a9ab0; --accent: #f03c3c; --ok: #34c759; --bad: #ff453a; --warn: #ffd60a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg); color: var(--text); min-height: 100vh;
      font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif; font-size: 14px;
      padding: 22px 26px 40px;
    }
    .wrap { max-width: 980px; margin: 0 auto; }
    header { display: flex; align-items: center; gap: 12px; margin-bottom: 6px; }
    h1 { font-size: 19px; }
    h1 img { width: 26px; height: 26px; border-radius: 6px; vertical-align: -6px; margin-right: 6px; }
    .badge {
      display: inline-flex; align-items: center; gap: 5px; font-size: 12px;
      padding: 3px 10px; border-radius: 20px; background: var(--card);
      border: 1px solid var(--border); color: var(--muted);
    }
    .badge.ok { color: var(--ok); border-color: #2a5c3a; background: #12251a; }
    .badge.bad { color: var(--bad); border-color: #5c2a2a; background: #251212; }
    .spacer { flex: 1; }
    button {
      border: none; border-radius: 8px; padding: 8px 14px; font-size: 13px;
      font-weight: 600; cursor: pointer; transition: filter .15s;
    }
    button:active { filter: brightness(.85); }
    button:disabled { opacity: .45; cursor: not-allowed; }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-ghost { background: var(--card); color: var(--text); border: 1px solid var(--border); }
    .btn-mini { padding: 4px 10px; font-size: 12px; font-weight: 500; }

    .overview { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; margin: 14px 0 18px; }
    .ov-top { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
    .ov-title { font-size: 15px; font-weight: 600; }
    .ov-meta { color: var(--muted); font-size: 12.5px; }
    .ov-meta .spd { color: var(--ok); }
    .bar { height: 8px; background: #2b2b3c; border-radius: 5px; overflow: hidden; margin-top: 10px; }
    .bar > div { height: 100%; background: linear-gradient(90deg, #f03c3c, #ff7a5c); border-radius: 5px; transition: width .4s; }
    .bar.done > div { background: var(--ok); }

    .filters { display: flex; gap: 8px; align-items: center; margin-bottom: 12px; flex-wrap: wrap; }
    .filters .spacer { flex: 1; }
    .chip {
      background: var(--card); border: 1px solid var(--border); color: var(--muted);
      border-radius: 20px; padding: 4px 12px; font-size: 12.5px; cursor: pointer;
    }
    .chip.active { color: #fff; border-color: var(--accent); background: #33161c; }

    .task { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; margin-bottom: 10px; }
    .task-head { display: flex; align-items: center; gap: 8px; }
    .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
    .dot.queued { background: var(--warn); }
    .dot.downloading { background: var(--accent); animation: blink 1s infinite; }
    .dot.done { background: var(--ok); }
    .dot.error { background: var(--bad); }
    @keyframes blink { 50% { opacity: .3; } }
    .task-title { font-weight: 600; font-size: 13.5px; flex: 1; word-break: break-all; }
    .task-meta { color: var(--muted); font-size: 12px; margin-top: 6px; display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
    .task-meta .spd { color: var(--ok); font-weight: 600; }
    .task-meta .pct { color: var(--text); font-weight: 600; }
    .path { color: var(--muted); font-size: 11.5px; margin-top: 6px; word-break: break-all; cursor: pointer; }
    .path:hover { color: var(--text); }
    .error-text { color: var(--bad); font-size: 12px; margin-top: 6px; word-break: break-all; }
    .actions { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
    .empty { color: var(--muted); text-align: center; padding: 46px 0; }
    .toast {
      position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%);
      background: #2b2b3c; color: var(--text); border: 1px solid var(--border);
      padding: 8px 16px; border-radius: 20px; font-size: 12.5px; opacity: 0;
      transition: opacity .25s; pointer-events: none;
    }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>
<div class="wrap">
  <header>
    <h1><img src="icons/icon48.png" alt="" />yt-dlp 任务中心</h1>
    <span id="health" class="badge">检测中…</span>
    <span class="spacer"></span>
    <button id="openDir" class="btn-ghost">📂 下载目录</button>
    <button id="refresh" class="btn-ghost">↻ 刷新</button>
  </header>

  <div class="overview" id="overview">
    <div class="ov-top">
      <span class="ov-title" id="ovTitle">暂无下载任务</span>
      <span class="ov-meta" id="ovMeta"></span>
    </div>
    <div class="bar" id="ovBar"><div id="ovFill" style="width:0%"></div></div>
  </div>

  <div class="filters">
    <span class="chip active" data-f="all">全部</span>
    <span class="chip" data-f="active">进行中</span>
    <span class="chip" data-f="done">已完成</span>
    <span class="chip" data-f="error">失败</span>
    <span class="spacer"></span>
    <span class="ov-meta" id="updatedAt"></span>
  </div>

  <div id="list"><div class="empty">暂无下载任务</div></div>
</div>
<div class="toast" id="toast"></div>

<script src="tasks.js"></script>
</body>
</html>
